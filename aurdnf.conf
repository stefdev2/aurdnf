# aurdnf.conf - how aurdnf translates Arch/AUR names into Fedora ones.
#
# Your own entries go in ~/.config/aurdnf/aurdnf.conf and override this file.
# dnf never reads this file: aurdnf uses it while generating the RPM, so the
# finished package only contains real Fedora package names.
#
# A dependency that is not in this file and not in Fedora, but exists in the
# AUR, is built from the AUR first (you review its PKGBUILD too). To stop that,
# map it to a Fedora package, or give it an empty value to drop it.
#
# [map]        Arch runtime dependency  =  Fedora package(s), space separated.
#              An empty value drops the dependency.
# [map-build]  Same, for makedepends (falls back to [map], then to a guess).
# [<pkgname>]  Per-package overrides:
#                requires_exclude = regex of Requires to leave out of the RPM
#                provides_exclude = regex of Provides to leave out of the RPM
#              Regexes are matched against strings like
#              libQt6Core.so.6()(64bit). Write literal dots and parentheses as
#              [.] [(] [)] instead of using backslashes.

[map]
libsm = libSM
libx11 = libX11
libxcomposite = libXcomposite
libxcursor = libXcursor
libxfixes = libXfixes
libxi = libXi
libxrandr = libXrandr
libxrender = libXrender
libxtst = libXtst
libpulse = pulseaudio-libs
mesa = mesa-libGL mesa-libEGL mesa-dri-drivers
ttf-font =
zlib = zlib-ng-compat
libgl = mesa-libGL
fuse2 = fuse-libs

[map-build]

[zoom]
requires_exclude = ^(libQt6Bodymovin[.]so|libQt6(EglFSDeviceIntegration|EglFsKmsGbmSupport|EglFsKmsSupport|LabsSharedImage)[.]so[.]6[(]Qt_6_PRIVATE_API[)])
